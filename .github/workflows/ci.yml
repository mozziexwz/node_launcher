name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch WinDivert 2.2.2-A (checksum verified)
        shell: pwsh
        run: ./scripts/fetch-windivert.ps1

      - name: Build ProxyBridgeCore.dll with MSVC
        shell: pwsh
        run: ./scripts/build-core.ps1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          MSBOOST_CORE_DLL: ${{ github.workspace }}\build\core\ProxyBridgeCore.dll
        run: go test -count=1 ./...

      - name: Build m0spike
        run: go build -o build/m0/m0spike.exe ./cmd/m0spike

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build launcher UI (Wails)
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          wails build -clean -m -platform windows/amd64

      - uses: actions/upload-artifact@v4
        with:
          name: m0-windows-x64
          path: |
            build/core/
            build/m0/m0spike.exe
            build/bin/MSBOOST-Launcher.exe
          if-no-files-found: error
