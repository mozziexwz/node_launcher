name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch WinDivert 2.2.2-A (checksum verified)
        shell: pwsh
        run: ./scripts/fetch-windivert.ps1

      - name: Build ProxyBridgeCore.dll with MSVC
        shell: pwsh
        run: ./scripts/build-core.ps1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      # Release builds embed build/core (-tags bundle); vet that file set too.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags bundle .

      # Node-side v2 probe for the contract test, pinned to mozziexwz/node v2.3.0.
      - name: Fetch node-side tcp_probe.py
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile .cache/tcp_probe.py `
            https://raw.githubusercontent.com/mozziexwz/node/4ebfc29331e61b4f65870ebe9ce70b733eee8d74/installers/node/tcp_probe.py

      - name: Test
        env:
          MSBOOST_CORE_DLL: ${{ github.workspace }}\build\core\ProxyBridgeCore.dll
          MSBOOST_NODE_PROBE: ${{ github.workspace }}\.cache\tcp_probe.py
        run: go test -count=1 ./...

      # Command-line tool for development and diagnostics, next to our patched
      # core and WinDivert.
      - name: Build msboostctl bundle
        shell: pwsh
        run: |
          go build -o build/m1/msboostctl.exe ./cmd/msboostctl
          Copy-Item build/core/* build/m1/
          (Get-ChildItem build/m1) | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Set-Content build/m1/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: msboostctl-windows-x64
          path: build/m1/
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The release build embeds the runtime files (-tags bundle). Wails builds
      # with -buildvcs=false, so the version carries the tag or the commit.
      - name: Build launcher (Wails)
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
            $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
            $cfg.info.productVersion = $version.TrimStart('v')
            $cfg | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          } else {
            $version = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          wails build -clean -m -platform windows/amd64 -tags bundle -ldflags "-X main.version=$version"

      # The portable release: one exe plus the license files.
      - name: Assemble release folder
        shell: pwsh
        run: |
          $dir = 'build/release'
          New-Item -ItemType Directory -Force $dir | Out-Null
          go run ./scripts/notices -o "$dir/THIRD_PARTY_NOTICES.txt"
          if ($LASTEXITCODE -ne 0) { throw 'notices failed' }
          Copy-Item build/bin/MSBOOST-Launcher.exe $dir/
          Copy-Item LICENSE "$dir/LICENSE.txt"
          (Get-ChildItem $dir -File) | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Set-Content "$dir/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: MSBOOST-Launcher-${{ env.VERSION }}-windows-x64
          path: build/release/
          if-no-files-found: error

  # A v* tag produces a draft release with the zip; it is published by hand.
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MSBOOST-Launcher-${{ github.ref_name }}-windows-x64
          path: package

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="MSBOOST-Launcher-${GITHUB_REF_NAME}-windows-x64"
          (cd package && zip -9 -r "../${name}.zip" .)
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" docs/release-notes-template.md > notes.md
          gh release create "$GITHUB_REF_NAME" "${name}.zip" "${name}.zip.sha256" --draft --verify-tag --title "MSBOOST 启动器 ${GITHUB_REF_NAME}" --notes-file notes.md
